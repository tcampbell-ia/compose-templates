services:
  # Postgres
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgtest
      PGDATA: /var/lib/postgresql/data
    volumes:
    - postgres-data:/var/lib/postgresql/data
    ports:
    - 5432:5432

volumes:
  postgres-data:

