services:
  # Papercut
  papercut:
    image: changemakerstudiosus/papercut-smtp:latest
    ports:
      - "37408:8080"  # Web UI
      - "2525:2525"   # SMTP
    environment:
      - SmtpServer__IP=0.0.0.0
      - SmtpServer__Port=2525
      - Urls=http://0.0.0.0:8080
    restart: unless-stopped
    networks:
      papercut:
        aliases:
          - papercut
networks:
  papercut:
